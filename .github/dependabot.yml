version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Group all action bumps into a single PR per week. Keeps notification
    # noise low and ensures the remaining SHA-pinned third-party `uses:` lines
    # (actions/checkout, actions/setup-node, pnpm/action-setup in the local
    # config/skills jobs) stay current. The shared-workflows callers now ride
    # the floating `@v1` major tag (A-672 / A-662), so Dependabot no longer
    # SHA-bumps them — it would only surface a future major (`@v2`). Grouped PRs
    # land or revert atomically.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Group the dev toolchain into a single PR per week, so one lockfile churn
    # lands or reverts atomically instead of racing across parallel PRs.
    groups:
      npm:
        patterns: ["*"]
    # `chore` (not `ci`) so subjects read `chore(deps): …` / `chore(deps-dev): …`
    # — Conventional, and a no-release type under the release-please bump rules,
    # so a dependency bump never cuts a version on its own. Both prefixes are
    # set explicitly: `prefix` alone leaves development-dependency bumps on
    # Dependabot's own default. See A-980 / A-823.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
