name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The PR title is the release-please bump signal (SK-380); only the action
# needs to read it. Least-privilege keeps CI's token read-only on PRs.
permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title is a Conventional Commit
    # Deliberately NOT skipped on the release-please branch (unlike the
    # ancillary lint jobs in validate.yml): the release PR's own title,
    # `chore(main): release …`, is itself a Conventional Commit that must clear
    # this gate, so the job runs on every PR. `requireScope: false` below keeps
    # that unscoped title valid.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🔠 Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirror the Conventional Commits types /send-it emits. feat / fix /
          # perf / revert and a `!` breaking marker are release-triggering
          # (release-please default node bump table); the rest are non-release types.
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            perf
            test
            build
            style
            revert
          requireScope: false
