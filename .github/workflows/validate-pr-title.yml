name: Validate PR title

on:
  pull_request:
    # `edited` re-runs when a title is corrected — the PR title is the
    # release-please bump signal (SK-380), so a stale pass on an old title
    # would be unsafe.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    uses: acme-skunkworks/shared-workflows/.github/workflows/reusable-validate-pr-title.yml@ff7151439d5f5d9820822e51b56ccba2d9c9c7f0 # v1.0.1
    secrets: inherit
